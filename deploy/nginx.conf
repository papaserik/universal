# Universal Shop — Nginx reverse proxy + gzip + static cache
# /etc/nginx/sites-available/universal-shop

upstream shop_backend {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name shop.example.com;

  # Лимит загрузки файлов
  client_max_body_size 20M;

  # gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json
    application/xml application/rss+xml
    image/svg+xml font/woff2;

  # Статика — отдельный root, кеш 30 дней
  location /css/   { alias /home/app/universal/src/public/css/;   expires 30d; access_log off; add_header Cache-Control "public, immutable"; }
  location /js/    { alias /home/app/universal/src/public/js/;    expires 30d; access_log off; add_header Cache-Control "public, immutable"; }
  location /img/   { alias /home/app/universal/src/public/img/;   expires 30d; access_log off; add_header Cache-Control "public, immutable"; }
  location /uploads/ { alias /home/app/universal/uploads/;        expires 30d; access_log off; add_header Cache-Control "public"; }

  # Service Worker и manifest — не кешировать агрессивно
  location ~ ^/modules/pwa/(sw\.js|manifest\.json)$ {
    proxy_pass http://shop_backend;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Всё остальное → Node
  location / {
    proxy_pass http://shop_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }
}
