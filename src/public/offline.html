<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нет интернета — Universal Shop</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .offline-card {
    background: #fff;
    color: #111;
    max-width: 440px;
    width: 100%;
    border-radius: 20px;
    padding: 48px 36px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .offline-icon {
    font-size: 64px;
    margin-bottom: 16px;
    line-height: 1;
  }
  .offline-card h1 {
    margin: 0 0 12px;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .offline-card p {
    margin: 0 0 24px;
    color: #6b7280;
    font-size: 15px;
    line-height: 1.6;
  }
  .offline-btn {
    display: inline-block;
    padding: 14px 32px;
    background: #0f172a;
    color: #fff;
    border: 0;
    border-radius: 12px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s;
  }
  .offline-btn:hover { background: #1e293b; }
  .offline-hint {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #f3f4f6;
    font-size: 13px;
    color: #9ca3af;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <h1>Нет подключения к интернету</h1>
    <p>Проверьте соединение и попробуйте снова. Некоторые страницы могут быть доступны из кеша.</p>
    <button class="offline-btn" onclick="location.reload()">Обновить страницу</button>
    <div class="offline-hint">
      Уже просмотренные страницы доступны без интернета
    </div>
  </div>
</body>
</html>
